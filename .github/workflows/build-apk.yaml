name: Build AISight Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python for model export
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-export.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install model export dependencies
        run: python -m pip install --no-cache-dir -r scripts/requirements-export.txt

      - name: Export custom AISight + YOLO26 depth models
        run: python scripts/export_models.py

      - name: Download Vosk small English offline model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl --fail --location --retry 4 --retry-delay 2 \
            https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip \
            --output /tmp/vosk-model.zip
          unzip -q /tmp/vosk-model.zip -d /tmp/vosk-model
          test -d /tmp/vosk-model/vosk-model-small-en-us-0.15
          rm -rf app/src/main/assets/vosk-model-small-en-us-0.15
          mv /tmp/vosk-model/vosk-model-small-en-us-0.15 app/src/main/assets/
          test -f app/src/main/assets/vosk-model-small-en-us-0.15/conf/model.conf

      - name: Fetch offline Piper Android runtime
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --recurse-submodules https://github.com/piper-tts-apps/piper-kotlin.git vendor/piper-kotlin
          test -f vendor/piper-kotlin/piper-engine/src/main/cpp/CMakeLists.txt
          # The Filipino voice uses eSpeak's Indonesian phonemizer, so stage both dictionaries.
          python - <<'PYCODE'
          from pathlib import Path
          script = Path('vendor/piper-kotlin/scripts/stage-espeak-data.sh')
          content = script.read_text()
          needle = 'rm -rf "$DICT_TMP"\n\necho "== staged at $DATA"'
          addition = '''rm -rf "$DICT_TMP"
          
          # Filipino Piper model uses the Indonesian (id) eSpeak phonemizer.
          DICT_TMP="$BUILD/dict-tmp-id"
          rm -rf "$DICT_TMP"; mkdir -p "$DICT_TMP"
          cp "$ESPEAK/dictsource/id_rules" "$ESPEAK/dictsource/id_list" \\
             "$ESPEAK/dictsource/id_emoji" "$DICT_TMP/"
          (cd "$DICT_TMP" && "$BIN" --compile=id > /dev/null)
          rm -rf "$DICT_TMP"
          
          echo "== staged at $DATA"'''
          if needle not in content:
              raise SystemExit('Could not patch Piper eSpeak staging script safely')
          script.write_text(content.replace(needle, addition))
          PYCODE
          bash vendor/piper-kotlin/scripts/fetch-native-deps.sh
          bash vendor/piper-kotlin/scripts/stage-espeak-data.sh
          mkdir -p third-party app/src/main/assets/piper/voices app/src/main/assets/piper/espeak-ng-data
          cp -a vendor/piper-kotlin/third-party/. third-party/
          cp -a vendor/piper-kotlin/third-party/espeak-ng/build/espeak-ng-data/. app/src/main/assets/piper/espeak-ng-data/
          mkdir -p app/src/main/assets/licenses
          cp THIRD_PARTY_NOTICES.md app/src/main/assets/licenses/
          find vendor/piper-kotlin third-party -maxdepth 4 -type f \
            \( -iname 'LICENSE' -o -iname 'LICENSE.*' -o -iname 'COPYING' -o -iname 'COPYING.*' \) \
            -exec cp --parents {} app/src/main/assets/licenses/ \;

      - name: Download bundled offline male voices
        shell: bash
        run: |
          set -euo pipefail
          VOICES="app/src/main/assets/piper/voices"
          mkdir -p "$VOICES"
          curl --fail --location --retry 5 --retry-delay 2 \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/mike/medium/en_US-mike-medium.onnx \
            --output "$VOICES/en_US-mike-medium.onnx"
          curl --fail --location --retry 5 --retry-delay 2 \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/mike/medium/en_US-mike-medium.onnx.json \
            --output "$VOICES/en_US-mike-medium.onnx.json"
          curl --fail --location --retry 5 --retry-delay 2 \
            https://huggingface.co/IhorShevchuk/piper-voice-tl-filipino/resolve/main/tl_PH-filipino-medium-model.onnx \
            --output "$VOICES/tl_PH-filipino-medium-model.onnx"
          curl --fail --location --retry 5 --retry-delay 2 \
            https://huggingface.co/IhorShevchuk/piper-voice-tl-filipino/resolve/main/tl_PH-filipino-medium-model.onnx.json \
            --output "$VOICES/tl_PH-filipino-medium-model.onnx.json"
          test -s "$VOICES/en_US-mike-medium.onnx"
          test -s "$VOICES/en_US-mike-medium.onnx.json"
          test -s "$VOICES/tl_PH-filipino-medium-model.onnx"
          test -s "$VOICES/tl_PH-filipino-medium-model.onnx.json"
          echo '4d59d1813484bedfb99a44204ce6e991  app/src/main/assets/piper/voices/en_US-mike-medium.onnx' | md5sum --check -
          echo '1ddf7bcf4b67eb6ec61b39e4bf46f90e  app/src/main/assets/piper/voices/en_US-mike-medium.onnx.json' | md5sum --check -
          test -s app/src/main/assets/piper/espeak-ng-data/id_dict
          test -s app/src/main/assets/piper/espeak-ng-data/en_dict

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # v4 no longer requests Google's removed "tools" SDK package by default.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Run unit tests
        continue-on-error: true
        run: gradle testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AISight-Mobile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
